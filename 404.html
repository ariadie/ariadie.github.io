<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <meta name="description" content="Halaman yang diminta tidak ditemukan di situs pembelajaran Ariadie Chandra Nugraha.">
  <title>Halaman Tidak Ditemukan — Ariadie Chandra Nugraha</title>
  <style>
    :root{color-scheme:light dark;--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#475569;--primary:#3152d4;--line:#cbd5e1}
    @media(prefers-color-scheme:dark){:root{--bg:#07111f;--card:#111827;--text:#f8fafc;--muted:#cbd5e1;--primary:#818cf8;--line:#334155}}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at top left,color-mix(in srgb,var(--primary) 22%,transparent),transparent 32rem),var(--bg);color:var(--text)}
    main{width:min(680px,100%);padding:44px;border:1px solid var(--line);border-radius:24px;background:var(--card);box-shadow:0 24px 70px rgba(15,23,42,.16);text-align:center}.code{margin:0;color:var(--primary);font-size:clamp(4rem,14vw,8rem);font-weight:900;line-height:1}h1{margin:.4rem 0;font-size:clamp(1.6rem,5vw,2.5rem)}p{color:var(--muted);line-height:1.7}.actions{margin-top:26px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.button{display:inline-flex;padding:12px 18px;border-radius:999px;text-decoration:none;font-weight:750;border:1px solid var(--line);color:var(--text)}.button.primary{border-color:transparent;background:var(--primary);color:#fff}.button:hover{transform:translateY(-1px)}
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Halaman tidak ditemukan</h1>
    <p>Alamat mungkin telah berubah, materi dipindahkan, atau tautannya belum tersedia. Gunakan beranda untuk menemukan materi publik yang aktif.</p>
    <div class="actions">
      <a class="button primary" href="./index.html">Kembali ke beranda</a>
      <a class="button" href="./index.html#materi-ajar">Lihat materi ajar</a>
    </div>
  </main>
</body>
</html>
