name: Basic site quality

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit public site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: |
          node --check assets/site-shell.js
          node --check tools/maintain-site.mjs
          node --check tools/audit-site.mjs

      - name: Audit committed site
        run: node tools/audit-site.mjs

      - name: Verify generated files are current
        run: |
          node tools/maintain-site.mjs
          node tools/audit-site.mjs
          git diff --check
          git diff --exit-code
